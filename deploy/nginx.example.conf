# Ejemplo para VPS: ajusta server_name, rutas y socket PHP-FPM.
# Tras `npm run build:deploy`, sube el contenido de /dist a $root.

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com;

    # No exponer la versión de Nginx en el header Server ni en páginas de error.
    server_tokens off;

    # Raíz = salida de Vite + carpeta api/ (build:deploy)
    root /var/www/sjelectronics/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad para el front estático (el proxy PHP ya trae las suyas).
    # Ajustá img-src/connect-src si el dominio de medios de WordPress es distinto al del front.
    # HSTS solo tiene sentido si este server además sirve por HTTPS (443) — agregalo ahí.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP del proxy WordPress (misma carpeta que el front)
    location ~ ^/api/.+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Debian/Ubuntu típico:
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # fastcgi_pass 127.0.0.1:9000;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
